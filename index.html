<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CULTUREON — O teu switch criativo</title>
  <meta name="description" content="CultureOn — agência criativa no Algarve. Produção de vídeo, identidade visual e branding." />
  <meta property="og:title" content="CULTUREON — O teu switch criativo" />
  <meta property="og:description" content="Produção de vídeo · Identidade visual & branding · Algarve" />
  <meta name="theme-color" content="#0A0A0A" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230A0A0A'/%3E%3Ctext x='50' y='98' font-family='Inter,Arial,sans-serif' font-size='120' text-anchor='middle' fill='%23D9FF47'%3E*%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0A0A0A;
      --fg: #F5F5F2;
      --muted: #8A8A85;
      --line: #F5F5F2;
      --accent: #D9FF47;
      --accent-ink: #0A0A0A;
      --bw: 1.35px;   /* espessura das linhas */
      --radius: 18px; /* cantos da moldura */
    }
    body.off {
      --bg: #F5F5F2;
      --fg: #0A0A0A;
      --muted: #6B6B66;
      --line: #0A0A0A;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "Inter", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background .25s ease, color .25s ease;
      display: flex;
      justify-content: center;
      padding: 28px 18px 40px;
    }
    main {
      width: 100%; max-width: 480px; align-self: flex-start;
      border: var(--bw) solid var(--line); border-radius: var(--radius);
      overflow: hidden; transition: border-color .25s ease;
    }

    /* ---------- top bar ---------- */
    .bar {
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: var(--bw) solid var(--line);
      padding: 10px 12px;
      font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
    }
    .switch {
      display: inline-flex; align-items: center; gap: 8px;
      background: none; border: 0; color: inherit; cursor: pointer;
      font: inherit; letter-spacing: inherit; text-transform: inherit;
    }
    /* mini-cápsula (mesmo estilo do interruptor do OFF, na horizontal) */
    .track {
      --glow: 217, 255, 71;
      position: relative; display: block;
      width: 46px; height: 22px; border-radius: 11px;
      border: 1px solid #0A0A0A;
      background: linear-gradient(90deg, #E2E2DE 0%, #ECECE8 50%, #FCFCFA 50%, #F1F1EE 100%);
      box-shadow: 6px 5px 8px -5px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.9);
      transition: background .25s ease, border-color .35s ease, box-shadow .35s ease;
    }
    /* luz a escapar pela ponta direita */
    .track::after {
      content: ""; position: absolute; inset: -1.5px; border-radius: 11px;
      border: 1.5px solid transparent; border-right-color: rgb(var(--glow));
      filter: blur(.5px) drop-shadow(3px 0 3px rgba(var(--glow), .9));
      transition: opacity .3s ease; pointer-events: none;
    }
    .knob { display: none; }
    /* ON: acesa */
    body:not(.off) .track {
      background: linear-gradient(90deg, #161616 0%, #121212 50%, #0E0E0E 50%, #141414 100%);
      border-color: rgb(var(--glow));
      box-shadow:
        0 0 0 .5px rgba(var(--glow), .9),
        0 0 6px 1px rgba(var(--glow), .8),
        0 0 16px 3px rgba(var(--glow), .35);
    }
    body:not(.off) .track::after { opacity: 0; }
    .switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

    /* ---------- hero ---------- */
    .hero {
      border-bottom: var(--bw) solid var(--line);
      padding: 36px 20px 28px;
      position: relative; overflow: hidden;
    }
    .spark-wrap { height: 92px; margin-bottom: 14px; position: relative; }
    .spark {
      position: absolute; left: 0; top: 0;
      font-family: "Inter", sans-serif; font-weight: 300;
      font-size: 150px; line-height: 1;
      color: var(--accent);
      will-change: transform;
    }
    .spark.ready { animation: spin 14s linear infinite; }
    .bolt { display: inline-block; width: .8em; height: .8em; vertical-align: -.08em; margin-left: .15em; fill: var(--fg); }
    body.off .spark { color: var(--fg); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spark { animation: none; } }

    h1 {
      margin: 0 -20px;
      font-family: "Syne", sans-serif; font-weight: 800;
      font-size: clamp(44px, 14vw, 68px); line-height: .95; letter-spacing: -.02em;
      text-transform: uppercase;
    }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .marquee { overflow: hidden; white-space: nowrap; }
    .marquee + .marquee { margin-top: .04em; }
    .marquee .run { display: inline-flex; width: max-content; will-change: transform; }
    .marquee .item { display: inline-flex; align-items: center; padding-right: .35em; }
    .marquee .sep {
      font-family: "Inter", sans-serif; font-weight: 300; color: var(--accent);
      margin-left: .35em; font-size: .9em; line-height: 1; transform: translateY(.08em);
    }
    .marquee.ltr .run { animation: to-right 33s linear infinite; }
    .marquee.rtl .run { animation: to-left 33s linear infinite; }
    @keyframes to-left  { from { transform: translateX(0); }    to { transform: translateX(-50%); } }
    @keyframes to-right { from { transform: translateX(-50%); } to { transform: translateX(0); } }
    @media (prefers-reduced-motion: reduce) { .marquee .run { animation: none; } }
    h1 .on { color: var(--accent); }
    body.off h1 .on { color: var(--fg); text-decoration: line-through; text-decoration-thickness: 2.7px; }
    body.off .marquee .sep { color: var(--fg); }
    .tagline {
      margin-top: 16px;
      font-family: "Syne", sans-serif; font-weight: 700;
      font-size: 18px; text-transform: uppercase; letter-spacing: .01em;
    }
    .meta {
      margin-top: 20px; display: flex; flex-wrap: wrap; gap: 10px 7px;
    }
    /* etiquetas = mini-cápsulas com luz por trás (mesmo estilo dos interruptores) */
    .meta span {
      --glow: 217, 255, 71;
      position: relative;
      border-radius: 999px; padding: 4px 10px;
      font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
      transition: background .35s ease, border-color .35s ease, box-shadow .35s ease, color .25s ease;
    }
    /* ON: acesas */
    body:not(.off) .meta span {
      background: linear-gradient(180deg, #161616 0%, #121212 50%, #0E0E0E 50%, #141414 100%);
      border: 1px solid rgba(var(--glow), .95);
      box-shadow:
        0 0 0 .5px rgba(var(--glow), .6),
        0 0 6px 1px rgba(var(--glow), .55),
        0 0 18px 3px rgba(var(--glow), .22);
    }
    /* OFF: apagadas, com a linha de luz a escapar por baixo */
    body.off .meta span {
      background: transparent;
      border: 1px solid #0A0A0A; color: #0A0A0A;
      box-shadow: none;
    }

    /* ---------- links ---------- */
    .links { list-style: none; }
    .links a {
      display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 12px;
      border-bottom: var(--bw) solid var(--line);
      padding: 18px 16px;
      color: inherit; text-decoration: none;
      transition: background .15s ease, color .15s ease;
    }
    .links .idx { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .08em; transition: color .15s; }
    .links .label {
      font-family: "Inter", sans-serif; font-weight: 600; font-size: 18px;
      text-transform: uppercase; letter-spacing: .02em; line-height: 1.1;
    }
    .links .sub { display: block; font-family: "Inter", sans-serif; font-weight: 400; font-size: 13px; text-transform: none; color: var(--muted); margin-top: 3px; letter-spacing: 0; transition: color .15s; }
    .links .arrow { font-size: 22px; line-height: 1; transition: transform .15s ease; }
    .links a:hover, .links a:focus-visible {
      background: var(--accent); color: var(--accent-ink); outline: none;
    }
    .links a:hover .idx, .links a:hover .sub,
    .links a:focus-visible .idx, .links a:focus-visible .sub { color: var(--accent-ink); }
    .links a:hover .arrow, .links a:focus-visible .arrow { transform: translateX(4px) rotate(-45deg); }

    .links li.featured a { background: var(--fg); color: var(--bg); }
    .links li.featured .idx, .links li.featured .sub { color: var(--bg); opacity: .7; }
    .links li.featured a:hover, .links li.featured a:focus-visible { background: var(--accent); color: var(--accent-ink); }
    .links li.featured a:hover .idx, .links li.featured a:hover .sub { opacity: 1; }

    /* ---------- easter egg: modo OFF ---------- */
    .off-panel { display: none; }
    body.off .links { display: none; }
    body.off .off-panel {
      display: flex; flex-direction: column; align-items: center;
      border-bottom: var(--bw) solid var(--line);
      padding: 14px 20px 16px; justify-content: center; box-sizing: border-box;
      animation: fade-in .35s ease;
    }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    /* interruptor-cápsula com luz */
    body.off .off-panel { transition: background .6s ease, color .6s ease; }
    body.off .off-panel.lit { background: #0A0A0A; color: #F5F5F2; }
    .rocker {
      --glow: 217, 255, 71;           /* #D9FF47 em RGB */
      background: none; border: 0; padding: 6px 30px; cursor: pointer;
      display: block; -webkit-tap-highlight-color: transparent;
    }
    .rocker:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
    .pill {
      position: relative; display: block;
      width: 64px; height: 164px; border-radius: 32px;
      border: 1px solid #0A0A0A;
      background: linear-gradient(180deg, #FCFCFA 0%, #F1F1EE 50%, #E2E2DE 50%, #ECECE8 100%);
      box-shadow:
        -16px 22px 26px -18px rgba(0,0,0,.35),       /* sombra da metade saliente */
        inset 0 1px 0 rgba(255,255,255,.9);
      transition: background .18s ease, border-color .5s ease, box-shadow .5s ease, transform .12s ease;
    }
    /* linha de luz a escapar por baixo */
    .pill::after {
      content: ""; position: absolute; inset: -1.5px; border-radius: 32px;
      border: 2px solid transparent; border-bottom-color: rgb(var(--glow));
      filter: blur(.8px) drop-shadow(0 4px 6px rgba(var(--glow), .9));
      opacity: .9; transition: opacity .4s ease; pointer-events: none;
    }
    /* clique: a metade de cima afunda */
    .rocker.flip .pill {
      background: linear-gradient(180deg, #E2E2DE 0%, #ECECE8 50%, #FCFCFA 50%, #F1F1EE 100%);
      box-shadow: -16px -22px 26px -18px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.6);
      transform: scale(.995);
    }
    /* tentativas: a luz pisca */
    .rocker.flicker1 .pill { animation: flick1 .45s ease; }
    .rocker.flicker2 .pill { animation: flick2 .6s ease; }
    @keyframes flick1 {
      30% { box-shadow: 0 0 0 1.5px rgba(var(--glow),.8), 0 0 14px 2px rgba(var(--glow),.45); }
    }
    @keyframes flick2 {
      20%, 55% { box-shadow: 0 0 0 1.5px rgba(var(--glow),1), 0 0 22px 5px rgba(var(--glow),.6), 0 0 50px 10px rgba(var(--glow),.25); }
      38% { box-shadow: none; }
    }
    /* acende de vez */
    .rocker.final .pill {
      background: linear-gradient(180deg, #161616 0%, #121212 50%, #0E0E0E 50%, #141414 100%);
      border-color: rgb(var(--glow));
      box-shadow:
        0 0 0 1px rgba(var(--glow), .9),
        0 0 10px 2px rgba(var(--glow), .85),
        0 0 32px 8px rgba(var(--glow), .45),
        0 0 80px 22px rgba(var(--glow), .2);
    }
    .rocker.final .pill::after { opacity: 0; }

    .off-hint {
      margin-top: 14px; text-align: center;
      font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    }
    .off-hint #off-msg { display: inline-block; font-family: "Syne", sans-serif; font-weight: 700; font-size: 18px; letter-spacing: .04em; }
    .off-hint #off-msg.nope { animation: nope .4s ease; }
    @keyframes nope { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
    .off-hint small { min-height: 1.5em; }
    .off-panel.lit .off-hint small { color: #8A8A85; }
    .off-hint small { display: block; margin-top: 4px; font-weight: 400; letter-spacing: .02em; text-transform: none; font-size: 13px; color: var(--muted); }

    /* ---------- footer ---------- */
    footer {
      
      padding: 14px 16px;
      display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <div class="bar">
      <span>CO™ / Links</span>
      <button class="switch" id="switch" type="button" aria-pressed="true" aria-label="Alternar modo claro/escuro">
        <span id="state">On</span>
        <span class="track"><span class="knob"></span></span>
      </button>
    </div>

    <header class="hero">
      <div class="spark-wrap" aria-hidden="true"><span class="spark" id="spark">*</span></div>
      <h1>
        <span class="sr">CultureOn</span>
        <div class="marquee ltr" aria-hidden="true"><div class="run" data-items="6"></div></div>
        <div class="marquee rtl" aria-hidden="true"><div class="run" data-items="6"></div></div>
      </h1>
      <p class="tagline">O teu switch criativo<svg class="bolt" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 1 3 14h7.5L9 23 21 9.5h-7.6L13.5 1Z"/></svg></p>
      <div class="meta">
        <span>Produção de vídeo</span>
        <span>Identidade visual &amp; branding</span>
        <span>Estratégia</span>
      </div>
    </header>

    <ul class="links" id="links"></ul>

    <div class="off-panel" id="off-panel">
      <button type="button" class="rocker" id="turn-on" tabindex="-1" aria-label="Ligar a página">
        <span class="pill" aria-hidden="true"></span>
      </button>
      <p class="off-hint" aria-live="polite"><span id="off-msg">Desligado.</span><small id="off-sub">Carrega no interruptor para ligar a CultureOn.</small></p>
    </div>

    <footer>
      <span>© <span id="year"></span> CultureOn</span>
      <span>Portimão — PT</span>
    </footer>
  </main>

  <script>
    /*
     * ============================================================
     *  LINKS — edita só esta lista.
     *  - Links com url vazio ("") não aparecem na página.
     *  - featured: true destaca o botão (fundo invertido).
     * ============================================================
     */
    const LINKS = [
      { label: "Pedir orçamento",  sub: "Conta-nos o que precisas",          url: "https://wa.me/351966180200?text=" + encodeURIComponent("Olá CultureOn! Gostava de pedir um orçamento para..."), featured: true },
      { label: "Website",          sub: "cultureon.pt",                      url: "https://cultureon.pt" },
      { label: "Instagram",        sub: "@cultureon.pt",                     url: "https://www.instagram.com/cultureon.pt/" },
      { label: "WhatsApp",         sub: "966 180 200",                       url: "https://wa.me/351966180200" },
      { label: "Portfólio",        sub: "Trabalho, não promessas",           url: "" },
      { label: "LinkedIn",         sub: "CultureOn",                         url: "" },
    ];

    const list = document.getElementById("links");
    LINKS.filter(l => l.url && l.url.trim()).forEach((l, i) => {
      const li = document.createElement("li");
      if (l.featured) li.className = "featured";
      const a = document.createElement("a");
      a.href = l.url;
      if (/^https?:/.test(l.url)) { a.target = "_blank"; a.rel = "noopener"; }
      const idx = document.createElement("span");
      idx.className = "idx";
      idx.textContent = String(i + 1).padStart(2, "0");
      const label = document.createElement("span");
      label.className = "label";
      label.textContent = l.label;
      if (l.sub) {
        const sub = document.createElement("span");
        sub.className = "sub";
        sub.textContent = l.sub;
        label.appendChild(sub);
      }
      const arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.setAttribute("aria-hidden", "true");
      arrow.textContent = "→";
      a.append(idx, label, arrow);
      li.appendChild(a);
      list.appendChild(li);
    });

    // Rodapé animado do título: "CULTURE ON *" repetido (duas metades iguais para o loop)
    document.querySelectorAll(".marquee .run").forEach(run => {
      const n = +run.dataset.items;
      for (let i = 0; i < n * 2; i++) {
        const item = document.createElement("span");
        item.className = "item";
        item.innerHTML = 'Culture&nbsp;<span class="on">On</span><span class="sep">*</span>';
        run.appendChild(item);
      }
    });

    document.getElementById("year").textContent = new Date().getFullYear();

    // Asterisco: calcula o centro real do glifo para rodar sobre si próprio
    function centerSpark() {
      const el = document.getElementById("spark");
      const wrap = el.parentElement;
      const cs = getComputedStyle(el);
      const ctx = document.createElement("canvas").getContext("2d");
      ctx.font = cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
      const m = ctx.measureText("*");
      // posição da baseline dentro do span
      const probe = document.createElement("span");
      probe.style.cssText = "display:inline-block;width:0;height:0;vertical-align:baseline";
      el.appendChild(probe);
      const baseline = probe.offsetTop;
      el.removeChild(probe);
      const gTop = baseline - m.actualBoundingBoxAscent;
      const gBottom = baseline + m.actualBoundingBoxDescent;
      const gLeft = -m.actualBoundingBoxLeft;
      const gRight = m.actualBoundingBoxRight;
      const cx = (gLeft + gRight) / 2, cy = (gTop + gBottom) / 2;
      const size = Math.max(gRight - gLeft, gBottom - gTop);
      // encosta o glifo ao canto superior esquerdo e centra-o na caixa
      el.style.left = (size / 2 - cx) + "px";
      el.style.top = (wrap.clientHeight / 2 - cy) + "px";
      el.style.transformOrigin = cx + "px " + cy + "px";
      el.classList.add("ready");
    }
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(centerSpark);

    // Switch ON / OFF (modo escuro / claro)
    const btn = document.getElementById("switch");
    const state = document.getElementById("state");
    let clicks = 0;
    const CLICKS_TO_ON = 3;
    const NOPE = ["Ainda não.", "VAAAI!"];
    function setMode(off) {
      if (off) { // o painel OFF fica com a mesma altura que os links
        const h = document.getElementById("links").offsetHeight;
        if (h) document.getElementById("off-panel").style.height = h + "px";
      }
      document.body.classList.toggle("off", off);
      btn.setAttribute("aria-pressed", String(!off));
      state.textContent = off ? "Off" : "On";
      document.getElementById("turn-on").tabIndex = off ? 0 : -1;
      if (off) { // reinicia o easter egg sempre que se desliga
        clicks = 0;
        document.getElementById("off-msg").textContent = "Desligado.";
        document.getElementById("off-sub").textContent = "Carrega no interruptor para ligar a CultureOn.";
      }
      document.querySelector('meta[name="theme-color"]').content = off ? "#F5F5F2" : "#0A0A0A";
    }
    setMode(false); // começa sempre ligado — o OFF é o easter egg
    const big = document.getElementById("turn-on");
    const msg = document.getElementById("off-msg");
    const sub = document.getElementById("off-sub");
    let busy = false;
    const panel = document.getElementById("off-panel");
    big.addEventListener("click", () => {
      if (busy) return;
      busy = true;
      clicks++;
      big.classList.add("flip");
      if (clicks >= CLICKS_TO_ON) {
        // último clique: acende de vez e volta à página principal
        big.classList.add("final");
        panel.classList.add("lit");
        msg.textContent = "É AGORA!";
        sub.textContent = "";
        setTimeout(() => {
          setMode(false);
          big.classList.remove("flip", "final", "flicker1", "flicker2");
          panel.classList.remove("lit");
          busy = false;
        }, 1100);
      } else {
        // tentativas: a luz pisca cada vez mais e o interruptor volta
        msg.textContent = NOPE[clicks - 1] || NOPE[NOPE.length - 1];
        sub.textContent = "";
        msg.classList.remove("nope"); void msg.offsetWidth; msg.classList.add("nope");
        big.classList.remove("flicker1", "flicker2"); void big.offsetWidth;
        big.classList.add(clicks === 1 ? "flicker1" : "flicker2");
        setTimeout(() => { big.classList.remove("flip"); busy = false; }, 320);
      }
    });
    btn.addEventListener("click", () => setMode(!document.body.classList.contains("off")));
  </script>
</body>
</html>
